<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giriş — Stock Portfolio Tracker</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="login-body">
    <div class="login-card">
      <div class="login-logo">▲ Stock Portfolio Tracker</div>
      <p class="login-subtitle muted">Hesabınıza giriş yapın</p>
      <form id="login-form" data-testid="login-form">
        <label for="login-username">Kullanıcı Adı</label>
        <input id="login-username" data-testid="login-username" type="text" required placeholder="admin" autocomplete="username" />
        <label for="login-password">Şifre</label>
        <input id="login-password" data-testid="login-password" type="password" required placeholder="••••••" autocomplete="current-password" />
        <div id="login-error" data-testid="login-error" class="login-error" hidden></div>
        <button type="submit" data-testid="login-submit">Giriş Yap</button>
      </form>
    </div>
    <script type="module" src="js/login.js"></script>
  </body>
</html>
